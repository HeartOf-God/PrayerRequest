services:
  - type: web
    name: heart-of-god-prayer
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAX_FILE_MB
        value: "15"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: WHATSAPP_PROVIDER
        value: callmebot
      # Render asks you for these during setup; they are never stored in GitHub
      - key: PRAYER_EMAIL_TO
        sync: false
      - key: WHATSAPP_TO
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CALLMEBOT_APIKEY
        sync: false
